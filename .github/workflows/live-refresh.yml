name: live-refresh

on:
  schedule:
    # 22:30 UTC on weekdays: after the US close in both EST (17:30) and EDT (18:30)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Rescore even if the live outputs are current"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Refresh data, signals and monitoring
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: uv run --frozen python -m risklens.live_pipeline ${{ inputs.force && '--force' || '' }}

      - name: Summarize the data status
        if: always()
        run: |
          {
            echo '```json'
            jq '{state, last_close, expected_last_session, sessions_behind, new_price_rows, components, errors}' data/live/data_status.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test the refreshed layer
        run: uv run --frozen pytest -q

      - name: Commit refreshed data
        run: |
          git config user.name "risklens-bot"
          git config user.email "risklens-bot@users.noreply.github.com"
          git add data/live
          if [ -f reports/live_monitoring.md ]; then git add reports/live_monitoring.md; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Live data refresh $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Flag use of a backup source
        run: |
          if [ "$(jq -r .backup_used data/live/data_status.json)" = "true" ]; then
            echo "::warning::A backup data source was used because the primary failed"
            jq -r '.errors[]' data/live/data_status.json
          fi

      - name: Fail loudly when the fetch fell back to old data
        run: |
          state=$(jq -r .state data/live/data_status.json)
          if [ "$state" = "fallback" ]; then
            echo "::error::Live fetch failed; the app is showing the last good data"
            jq -r '.errors[]' data/live/data_status.json
            exit 1
          fi
