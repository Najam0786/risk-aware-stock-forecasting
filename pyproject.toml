[project]
name = "risklens"
version = "0.1.0"
description = "Risk-aware stock forecasting and trading decision support (MSc TFM)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arch>=7.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=17.0",
    "requests>=2.32",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "streamlit>=1.40",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risklens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
